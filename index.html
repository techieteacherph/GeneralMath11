<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#142b4a"><meta name="application-name" content="Math @11"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Math @11"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>MVTS | Grade 11 General Mathematics EXP^2</title>
<style>
:root{--navy:#142b4a;--blue:#2463a6;--sky:#eaf4ff;--gold:#f4b942;--ink:#203047;--muted:#64748b;--paper:#f5f8fc;--green:#16845b;--red:#bd3d42;--line:#dce5ef}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Segoe UI",Arial,sans-serif}
header{background:linear-gradient(120deg,#102744,#2463a6);color:#fff;padding:24px 0}.wrap{max-width:1050px;margin:auto;padding:0 18px}
header h1{font-size:clamp(1.5rem,4vw,2.3rem);margin:6px 0}header p{margin:0;color:#dcecff}.badge{float:right;background:#ffffff22;border:1px solid #ffffff55;border-radius:99px;padding:5px 12px;font-size:.85rem}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}nav .wrap{display:flex;gap:6px;overflow:auto;padding-top:8px;padding-bottom:8px}
nav button{white-space:nowrap;border:0;background:none;padding:9px 13px;border-radius:9px;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}nav button.on{background:var(--sky);color:var(--blue)}
main{padding:22px 18px 50px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h2{color:var(--navy);margin:0 0 10px}h3{color:var(--navy);margin:14px 0 6px}.muted{color:var(--muted)}.small{font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.tile{background:#f7faff;border:1px solid var(--line);border-radius:12px;padding:13px;text-align:left;font:inherit;color:inherit}
button.tile{cursor:pointer}button.tile:hover{border-color:var(--blue)}.tile b{display:block;color:var(--navy)}
.bar{height:7px;background:#e6edf5;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold)}
.math{font-size:1.1rem;font-weight:700;color:#174d85;background:#f0f6ff;padding:12px 15px;border-radius:10px;margin:8px 0}
.callout{border-left:4px solid var(--gold);background:#fff9e9;padding:11px 15px;border-radius:8px;margin:12px 0}.good{border-left-color:var(--green);background:#eefaf4}
.p,.s,.d{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}.p{background:var(--blue);color:#fff}.s{background:#eaf2fb;color:var(--blue)}.d{background:#fff0f0;color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd7e5;border-radius:9px;font:inherit;background:#fff}label{display:block;font-weight:700;margin:11px 0 5px}label.ck{display:flex;gap:9px;font-weight:500;margin:6px 0}label.ck input{width:auto}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.fb{font-weight:700;margin-top:8px}.ok{color:var(--green)}.no{color:var(--red)}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{background:#f1f6fc}.tw{overflow:auto}
pre{background:#10233d;color:#d8eaff;padding:12px;border-radius:10px;overflow:auto;font-size:.8rem;white-space:pre-wrap}
footer{background:#102744;color:#d9e8f8;padding:18px;text-align:center;font-size:.88rem}.hidden{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media print{nav,.no-print,header .badge{display:none!important}}
.brand{display:flex;align-items:center;gap:10px}.brand img{height:46px;width:46px;object-fit:contain;background:#fff;border-radius:10px;padding:2px}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}.hd{display:flex;gap:6px;align-items:center}.hd .badge{float:none}.hd .s{margin:0;background:#fff}#adm{padding-top:14px}.bar.big{height:14px}.hero{display:flex;gap:14px;align-items:center}.hero img{width:84px;border-radius:10px}nav button,.p,.s,.d,select,input:not([type=checkbox]){min-height:44px}details{margin:10px 0}summary{cursor:pointer;padding:6px 0}
@media(max-width:560px){header h1{font-size:1.1rem}.brand img{height:36px;width:36px}main{padding:14px 12px 40px}.panel{padding:15px}.hero img{width:64px}}
.vid{position:relative;padding-top:56.25%;margin-top:8px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}.nl a{word-break:break-word}.nl .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0}
.lb{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.lb.me{background:var(--sky);border-radius:9px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0}
html{-webkit-text-size-adjust:100%}button,select,input,summary{touch-action:manipulation}button{-webkit-tap-highlight-color:transparent}
.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}footer{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.hero img{width:96px}@media(max-width:560px){.hero img{width:72px}}@media(min-width:900px){.hero img{width:120px}}
@media(display-mode:standalone){body{overscroll-behavior-y:none}}
footer a{color:#fff;font-weight:700}
</style></head><body>

lastSync=new Date().toLocaleString();S('files',files);S('packs',packs);S('sync',lastSync);msg('Done: '+n+' lesson pack(s), '+files.length+' file(s).');}catch(x){msg('Sync failed: '+x.message)}}
